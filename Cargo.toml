[package]
name = "plex_client"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
http = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
urlencoding = "2"
